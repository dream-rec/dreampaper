[package]
name = "dreampaper"
version = "0.2.1"
description = "DreamPaper desktop app"
authors = ["DreamPaper"]
edition = "2021"

[lib]
name = "dreampaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "charset", "http2", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Workbench: authoritative compositing of repair fills and text, plus PNG
# output with an explicit metadata whitelist. `png` is already pulled in by
# `image`; depending on it directly lets export write ICC/sRGB/pHYs chunks.
tiny-skia = "0.11"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
png = "0.18"
sys-locale = "0.3"
# Native OCR: only the IPC protocol, padding geometry and process supervisor
# of the sidecar crate are compiled into the app; the inference engine stays
# in the separately built `dreampaper-ocr` binary.
dreampaper-ocr = { path = "ocr", default-features = false }
# The official model archives are plain (uncompressed) tar files.
tar = "0.4"

# Rescaling a 5504x3072 figure takes ~19s unoptimized against ~0.6s optimized,
# so an unoptimized image stack makes `tauri dev` look like the thumbnail cache
# is broken. Only these dependencies are optimized; our own crate stays
# debuggable and the release profile is untouched.
[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net", "io-util"] }

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
