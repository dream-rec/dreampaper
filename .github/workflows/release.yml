name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀），仅用于手动试跑"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: ORT ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: 安装 ORT 构建工具
        run: python -m pip install cmake==4.1.2 ninja==1.13.0
      - uses: actions/cache@v4
        id: ort
        with:
          path: src-tauri/runtime/${{ matrix.target }}
          key: ort-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('scripts/ort.mjs', 'scripts/runtime.mjs', 'src-tauri/runtime/runtime.json', 'src-tauri/ocr/THIRD_PARTY.md', '.github/workflows/release.yml') }}
      - name: 原生构建锁定 ORT
        if: steps.ort.outputs.cache-hit != 'true'
        run: node scripts/ort.mjs --target ${{ matrix.target }}
      - name: 校验运行时清单
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node --input-type=module -e "import {verifyRuntime} from './scripts/runtime.mjs'; verifyRuntime('src-tauri/runtime/'+process.env.TARGET,process.env.TARGET)"
      - uses: actions/upload-artifact@v4
        with:
          name: ort-${{ matrix.target }}
          path: src-tauri/runtime/${{ matrix.target }}/
          if-no-files-found: error

  build:
    needs: runtime
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows (setup + portable ZIP)
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            label: macOS Intel
            target: x86_64-apple-darwin
            bundles: app
          - os: macos-14
            label: macOS Apple Silicon
            target: aarch64-apple-darwin
            bundles: app
          - os: ubuntu-22.04
            label: Ubuntu 22.04+ (.deb)
            target: x86_64-unknown-linux-gnu
            bundles: deb
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/ocr
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ort-${{ matrix.target }}
          path: src-tauri/runtime/${{ matrix.target }}/
      - name: 对齐版本
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          node .github/scripts/set-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: 暂存完整 OCR 引擎
        run: node scripts/sidecar.mjs --target ${{ matrix.target }}
      - run: node --test scripts/runtime.test.mjs
      - run: npm test
      - run: npx tsc -b
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/ocr/Cargo.toml
      - name: 构建最终安装包
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 归集五类产物
        run: node scripts/bundle.mjs ${{ matrix.target }} ${{ steps.version.outputs.version }}
      - name: 最终产物真实下载与离线 OCR 门禁
        run: node scripts/probe.mjs ${{ matrix.target }} ${{ steps.version.outputs.version }}
      - name: 保存门禁证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.target }}
          path: release-reports/
          if-no-files-found: warn
      - name: 上传已验收产物
        uses: actions/upload-artifact@v4
        with:
          name: dreampaper-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  draft:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: dreampaper-*
          path: release-artifacts
          merge-multiple: true
      - name: 校验完整产物并生成发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/draft.mjs
